worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 0.0.0.0/0;

    limit_req_zone $binary_remote_addr zone=ui_limit:10m rate=5r/s;
    access_log /dev/stdout;
    error_log /dev/stdout info;

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            mirror /_nginx_log_internal;
            mirror_request_body off;

            try_files $uri $uri/ /index.html;
        }

        location = /version {
            proxy_pass http://127.0.0.1:3001/version;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        location = /_context {
            proxy_pass http://127.0.0.1:3001/_context;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        location = /_frame {
            proxy_pass http://127.0.0.1:3001/_frame;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        location = /_nginx_log_internal {
            internal;
            proxy_connect_timeout 200ms;
            proxy_read_timeout 200ms;

            proxy_pass http://127.0.0.1:3001/_nginx_log;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_set_header X-Request-URI $request_uri;
            proxy_set_header X-Request-Method $request_method;
            proxy_set_header X-Request-Time $time_iso8601;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
