worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;            # ✅ MIME types for JS/CSS/WASM
    default_type  application/octet-stream;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 0.0.0.0/0;

    # Rate limiting for SPA navigation requests
    limit_req_zone $binary_remote_addr zone=ui_limit:10m rate=5r/s;

    error_log /dev/stderr warn;

    server {
        listen 80;

        root /usr/share/nginx/html;       # Make sure your Vite build is here
        index index.html;

        location / {
            # Optional: mirror only real page loads (internal endpoint)
            # mirror /_nginx_log_internal;

            # Handle preflight / OPTIONS requests
            if ($request_method = OPTIONS) {
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            try_files $uri $uri/ /index.html;

            limit_req zone=ui_limit burst=10 nodelay;
        }

        location = /version {
            proxy_pass http://127.0.0.1:3001/version;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        location = /_context {
            proxy_pass http://127.0.0.1:3001/_context;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        location = /_frame {
            proxy_pass http://127.0.0.1:3001/_frame;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }
        location = /_nginx_log_internal {
            internal;
            proxy_pass http://127.0.0.1:3001/_nginx_log;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-URI $request_uri;
            proxy_set_header X-Request-Method $request_method;
            proxy_set_header X-Request-Time $time_iso8601;
            proxy_set_header X-User-Agent $http_user_agent;

            proxy_connect_timeout 500ms;
            proxy_read_timeout 500ms;
            proxy_next_upstream off;
        }
    }
}
